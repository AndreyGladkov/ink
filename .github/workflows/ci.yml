name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      phone: ${{ steps.filter.outputs.phone }}
      messages: ${{ steps.filter.outputs.messages }}
      clock: ${{ steps.filter.outputs.clock }}
      calculator: ${{ steps.filter.outputs.calculator }}
      launcher: ${{ steps.filter.outputs.launcher }}
      weather: ${{ steps.filter.outputs.weather }}
      gallery: ${{ steps.filter.outputs.gallery }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'gradle/**'
              - 'gradle.properties'
              - '*.gradle.kts'
              - '.github/workflows/ci.yml'
            ui: &ui
              - *shared
              - 'ink-ui/**'
            phone:
              - *ui
              - 'ink-phone/**'
            messages:
              - *ui
              - 'ink-messages/**'
            clock:
              - *ui
              - 'ink-clock/**'
            calculator:
              - *ui
              - 'ink-calculator/**'
            launcher:
              - *ui
              - 'ink-launcher/**'
            weather:
              - *ui
              - 'ink-weather/**'
            gallery:
              - *ui
              - 'ink-gallery/**'

  ui:
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew :ink-ui:testDebugUnitTest

      - name: Lint
        run: ./gradlew :ink-ui:lintRelease

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: ui-reports
          path: ink-ui/build/reports

  phone:
    needs: changes
    if: ${{ needs.changes.outputs.phone == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew :ink-phone:testDebugUnitTest

      - name: Lint
        run: ./gradlew :ink-phone:lintRelease

      - name: Build release APK
        run: ./gradlew :ink-phone:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: InkPhone-unsigned
          path: ink-phone/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: phone-reports
          path: ink-phone/build/reports

  messages:
