name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      phone: ${{ steps.filter.outputs.phone }}
      messages: ${{ steps.filter.outputs.messages }}
      clock: ${{ steps.filter.outputs.clock }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'gradle/**'
              - 'gradle.properties'
              - '*.gradle.kts'
              - '.github/workflows/ci.yml'
            ui: &ui
              - *shared
              - 'ink-ui/**'
            phone:
              - *ui
              - 'ink-phone/**'
            messages:
              - *ui
              - 'ink-messages/**'
            clock:
              - *ui
              - 'ink-clock/**'

  ui:
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew :ink-ui:testDebugUnitTest

      - name: Lint
        run: ./gradlew :ink-ui:lintRelease

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: ui-reports
          path: ink-ui/build/reports

  phone:
    needs: changes
    if: ${{ needs.changes.outputs.phone == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew :ink-phone:testDebugUnitTest

      - name: Lint
        run: ./gradlew :ink-phone:lintRelease

      - name: Build release APK
        run: ./gradlew :ink-phone:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: InkPhone-unsigned
          path: ink-phone/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: phone-reports
          path: ink-phone/build/reports

  messages:
    needs: changes
    if: ${{ needs.changes.outputs.messages == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew :ink-messages:testDebugUnitTest

      - name: Lint
        run: ./gradlew :ink-messages:lintRelease

      - name: Build release APK
        run: ./gradlew :ink-messages:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: InkMessages-unsigned
          path: ink-messages/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: messages-reports
          path: ink-messages/build/reports

  clock:
    needs: changes
    if: ${{ needs.changes.outputs.clock == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew :ink-clock:testDebugUnitTest

      - name: Lint
        run: ./gradlew :ink-clock:lintRelease

      - name: Build release APK
        run: ./gradlew :ink-clock:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: InkClock-unsigned
          path: ink-clock/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: clock-reports
          path: ink-clock/build/reports
